<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>스마트 창문 제어</title>
    <style>
        body { font-family: sans-serif; text-align: center; padding: 50px; }
        .card { border: 1px solid #ccc; padding: 20px; border-radius: 10px; margin-bottom: 20px; }
        .sensor-row { margin: 10px 0; font-size: 18px; }
        button { padding: 10px 20px; margin: 5px; cursor: pointer; font-size: 16px; }
        #alertBox { display: none; color: white; background-color: red; padding: 10px; font-weight: bold; margin-bottom: 20px; }
        .rain-warning { color: blue; font-weight: bold; } 
        /* 슬라이더 디자인 */
        input[type=range] { width: 60%; margin: 15px 0; }
    </style>
</head>
<body>
    <h2>스마트 홈 대시보드</h2>
    
    <!-- 외부 위험 알림창 -->
    <div id="alertBox">⚠️ 긴급: 과부하 위험 감지! 시스템을 보호합니다.</div>

    <!-- 센서 데이터 표시 영역 -->
    <div class="card">
        <h3>실내외 온습도 및 환경 수치</h3>
        <div class="sensor-row">
            🏠 <strong>[실내]</strong> 온도: <span id="inTempDisplay">--</span> °C | 습도: <span id="inHumDisplay">--</span> %
        </div>
        <div class="sensor-row">
            ☁️ <strong>[실외]</strong> 온도: <span id="outTempDisplay">--</span> °C | 습도: <span id="outHumDisplay">--</span> %
        </div>
        <div class="sensor-row">
            🌬️ 미세먼지: <span id="dustDisplay">--</span> μg/m³
        </div>
        <div class="sensor-row">
            🌧️ 강우 상태: <span id="rainDisplay">--</span>
        </div>
        <br>
        <p>현재 창문 상태: <strong id="stateDisplay" style="font-size: 20px;">알 수 없음</strong></p>
    </div>

    <!-- 임계치 튜닝 영역 -->
    <div class="card">
        <h3>자동 개폐 임계치 튜닝</h3>
        <p>미세먼지 허용 기준: <strong id="thresholdView" style="color: green;">35</strong> μg/m³</p>
        <input type="range" id="dustSlider" min="10" max="100" step="5" value="35" oninput="updateSliderText(this.value)">
        <br>
        <button onclick="sendThreshold()">설정 적용</button>
    </div>

    <!-- 창문 수동 제어 버튼 영역 -->
    <div class="card">
        <h3>수동 제어</h3>
        <button onclick="sendCommand('OPEN')">창문 열기</button>
        <button onclick="sendCommand('CLOSE')">창문 닫기</button>
        <button onclick="sendCommand('AUTO')">자동 모드</button>
    </div>

    <script>
        // 서버 주소 (플라스크 서버가 동작 중인 주소)
        // 라즈베리파이 등 외부 기기 접속 시 'http://라즈베리파이IP:5000'으로 변경 필요
        const SERVER_URL = "http://127.0.0.1:5000";

        // 1. 서버에서 센서 데이터를 가져와 화면을 실시간 업데이트 (GET 방식)
        async function fetchDashboard() {
            try {
                let response = await fetch(SERVER_URL + "/status");
                if (!response.ok) throw new Error("네트워크 응답 오류");
                
                let data = await response.json();

                document.getElementById("inTempDisplay").innerText = data.indoor_temp !== undefined ? data.indoor_temp : "--";
                document.getElementById("inHumDisplay").innerText = data.indoor_hum !== undefined ? data.indoor_hum : "--";
                document.getElementById("outTempDisplay").innerText = data.outdoor_temp !== undefined ? data.outdoor_temp : "--";
                document.getElementById("outHumDisplay").innerText = data.outdoor_hum !== undefined ? data.outdoor_hum : "--";
                document.getElementById("dustDisplay").innerText = data.dust !== undefined ? data.dust : "--";
                
                let rainSpan = document.getElementById("rainDisplay");
                if (data.rain_detected === true) {
                    rainSpan.innerText = "비 감지됨 🌧️";
                    rainSpan.className = "rain-warning";
                } else {
                    rainSpan.innerText = "맑음 ☀️";
                    rainSpan.className = "";
                }

                document.getElementById("stateDisplay").innerText = data.window_state !== undefined ? data.window_state : "알 수 없음";

                if (data.fault_alert === 1) {
                    document.getElementById("alertBox").style.display = "block";
                } else {
                    document.getElementById("alertBox").style.display = "none";
                }
            } catch (error) {
                console.error("서버 연결 실패:", error);
                // 통신 실패 시 화면 갱신을 멈추거나 에러를 표시할 수 있음
            }
        }

        // 2. 수동 제어 명령어 전송 (POST 방식)
        async function sendCommand(cmd) {
            try {
                await fetch(SERVER_URL + "/command", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ "cmd": cmd })
                });
                console.log("제어 명령 전송 성공:", cmd);
                fetchDashboard(); // 서버에 명령 전달 후 화면 즉시 동기화
            } catch (error) {
                alert("서버 통신 에러! 파이썬 서버가 켜져 있는지 확인하세요.");
            }
        }

        // 3. 슬라이더 바 실시간 텍스트 업데이트
        function updateSliderText(val) {
            document.getElementById("thresholdView").innerText = val;
        }

        // 4. [설정 적용] 버튼을 눌렀을 때 서버로 임계치 데이터를 전송 (POST 방식)
        async function sendThreshold() {
            let targetValue = document.getElementById("dustSlider").value;
            try {
                await fetch(SERVER_URL + "/command", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ "set_dust": parseInt(targetValue) })
                });
                alert("임계치 " + targetValue + " μg/m³ 설정 완료!");
            } catch (error) {
                alert("서버 통신 에러! 파이썬 서버가 켜져 있는지 확인하세요.");
            }
        }

        // 5. 1초(1000ms)마다 주기적으로 서버 데이터를 긁어와 화면 갱신 (Polling)
        setInterval(fetchDashboard, 1000);
        
        // 브라우저가 열리자마자 1회 즉시 실행
        fetchDashboard();
    </script>
</body>
</html>
