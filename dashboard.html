<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>스마트 창문 제어</title>
    <style>
        body { font-family: sans-serif; text-align: center; padding: 50px; }
        .card { border: 1px solid #ccc; padding: 20px; border-radius: 10px; margin-bottom: 20px; }
        .sensor-row { margin: 10px 0; font-size: 18px; }
        button { padding: 10px 20px; margin: 5px; cursor: pointer; font-size: 16px; }
        #alertBox { display: none; color: white; background-color: red; padding: 10px; font-weight: bold; margin-bottom: 20px; }
        .moving { color: orange; font-weight: bold; }
        .raw { font-size: 13px; color: gray; }
        .chip { display: inline-block; padding: 2px 10px; border-radius: 12px; color: white; font-size: 15px; font-weight: bold; background: #999; }
        .dot { display: inline-block; width: 16px; height: 16px; border-radius: 50%; vertical-align: middle; border: 1px solid #888; background: #ddd; }
        input[type=range] { width: 60%; margin: 15px 0; }
    </style>
</head>
<body>
    <h2>스마트 홈 대시보드</h2>

    <!-- 장애 알림창 -->
    <div id="alertBox">장애 발생</div>

    <div class="card">
        <h3>실내외 온습도 및 환경 수치</h3>
        <div class="sensor-row">
            [실내] 온도: <span id="inTempDisplay">--</span> °C | 습도: <span id="inHumDisplay">--</span> %
        </div>
        <div class="sensor-row">
            [실외·기상청] 온도: <span id="outTempDisplay">--</span> °C | 습도: <span id="outHumDisplay">--</span> %
        </div>
        <div class="sensor-row">
            미세먼지: <span id="dustDisplay">--</span> μg/m³
            <span id="dustLevel" class="chip">--</span> <span id="ledDot" class="dot" title="LED 색"></span>
            <span class="raw">(원시값 <span id="dustRawDisplay">--</span>)</span>
        </div>
        <div class="sensor-row">
            날씨: <strong id="wxText">--</strong>
        </div>
        <br>
        <p>현재 창문 상태: <strong id="stateDisplay" style="font-size: 20px;">알 수 없음</strong>
           <span id="movingDisplay"></span>
           <span style="font-size: 14px; color: gray;">(<span id="modeDisplay">AUTO</span> 모드)</span></p>
    </div>

    <div class="card">
        <h3>자동 개폐 임계치 튜닝</h3>
        <p>미세먼지 허용 기준: <strong id="thresholdView" style="color: green;">35</strong> μg/m³</p>
        <input type="range" id="dustSlider" min="10" max="100" step="5" value="35" oninput="updateSliderText(this.value)">
        <br>
        <button onclick="sendThreshold()">설정 적용</button>
    </div>

    <div class="card">
        <h3>수동 제어</h3>
        <button onclick="sendCommand('OPEN')">창문 열기</button>
        <button onclick="sendCommand('CLOSE')">창문 닫기</button>
        <button onclick="sendCommand('AUTO')">자동 모드</button>
    </div>

    <script>
        const SERVER_URL = "";

        const STATE_TEXT = { "OPEN": "열림", "CLOSED": "닫힘", "UNKNOWN": "알 수 없음" };
        let sliderSynced = false; 

        const LED_CSS = { "blue": "#2563eb", "green": "#16a34a", "orange": "#f59e0b", "red": "#dc2626", "off": "#dddddd" };

        function setText(id, value) {
            document.getElementById(id).innerText = (value !== undefined && value !== null) ? value : "--";
        }

        async function fetchDashboard() {
            try {
                let response = await fetch(SERVER_URL + "/status");
                if (!response.ok) throw new Error("네트워크 응답 오류");
                let data = await response.json();

                setText("inTempDisplay", data.indoor_temp);
                setText("inHumDisplay", data.indoor_hum);
                setText("outTempDisplay", data.outdoor_temp);
                setText("outHumDisplay", data.outdoor_hum);
                setText("dustDisplay", data.dust);
                setText("dustRawDisplay", data.dust_raw);

                // 날씨 문구 표시 (맑음, 흐림, 비 등 서버에서 받아온 텍스트)
                setText("wxText", data.weather_text);

                // 미세먼지 단계 + LED 색
                let lvl = document.getElementById("dustLevel");
                lvl.innerText = data.dust_level || "--";
                lvl.style.background = LED_CSS[data.led_color] || "#999";
                document.getElementById("ledDot").style.background = LED_CSS[data.led_color] || "#ddd";

                document.getElementById("stateDisplay").innerText =
                    STATE_TEXT[data.window_state] || data.window_state || "알 수 없음";

                let movingSpan = document.getElementById("movingDisplay");
                if (data.moving) {
                    movingSpan.innerText = " [이동 중...]";
                    movingSpan.className = "moving";
                } else {
                    movingSpan.innerText = "";
                    movingSpan.className = "";
                }

                setText("modeDisplay", data.mode);

                if (!sliderSynced && data.dust_threshold !== undefined) {
                    document.getElementById("dustSlider").value = data.dust_threshold;
                    updateSliderText(data.dust_threshold);
                    sliderSynced = true;
                }

                let alertBox = document.getElementById("alertBox");
                if (data.fault_alert === 1) {
                    alertBox.innerText = "[장애 발생] " + (data.fault_message || "");
                    alertBox.style.display = "block";
                } else {
                    alertBox.style.display = "none";
                }
            } catch (error) {
                console.error("서버 연결 실패:", error);
                let alertBox = document.getElementById("alertBox");
                alertBox.innerText = "[통신 오류] 서버와 통신할 수 없습니다";
                alertBox.style.display = "block";
            }
        }

        async function sendCommand(cmd) {
            try {
                let response = await fetch(SERVER_URL + "/command", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ "cmd": cmd })
                });
                if (!response.ok) throw new Error("명령 거부됨");
                fetchDashboard();
            } catch (error) {
                alert("서버 통신 에러! 파이썬 서버가 켜져 있는지 확인하세요.");
            }
        }

        function updateSliderText(val) {
            document.getElementById("thresholdView").innerText = val;
        }

        async function sendThreshold() {
            let targetValue = document.getElementById("dustSlider").value;
            try {
                let response = await fetch(SERVER_URL + "/command", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ "set_dust": parseInt(targetValue) })
                });
                if (!response.ok) throw new Error("설정 거부됨");
                alert("임계치 " + targetValue + " μg/m³ 설정 완료!");
            } catch (error) {
                alert("서버 통신 에러! 파이썬 서버가 켜져 있는지 확인하세요.");
            }
        }

        setInterval(fetchDashboard, 1000);
        fetchDashboard();
    </script>
</body>
</html>
